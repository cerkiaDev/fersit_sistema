<div class="modal fade" id="editProductModal" tabindex="-1" aria-labelledby="editProductModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="editProductForm" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <div class="modal-header">
        <h5 class="modal-title" id="editProductModalTitle">Editar Producto</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="editProductErrors" class="alert alert-danger d-none mb-3" role="alert"></div>
        <div class="mb-3"><label class="form-label" for="editProductName">Nombre *</label><input id="editProductName" name="nombre" type="text" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="editProductDescription">Descripción</label><textarea id="editProductDescription" name="descripcion" class="form-control" rows="3"></textarea></div>
        <div class="mb-3"><label class="form-label" for="editProductPrice">Precio base *</label><input id="editProductPrice" name="precio_base" type="number" step="0.01" min="0" class="form-control" required></div>
        <div class="mb-3"><label class="form-label" for="editProductImage">Imagen</label><input id="editProductImage" name="imagen" type="file" class="form-control" accept="image/*"><div id="editProductImageStatus" class="form-text">Sin archivos seleccionados</div></div>
        <div class="form-check"><input id="editProductActive" name="activo" class="form-check-input" type="checkbox"><label class="form-check-label" for="editProductActive">Activo</label></div>
      </div>
      <div class="modal-footer justify-content-end">
        <button type="button" class="btn btn-fersit-outline" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-fersit" id="editProductSave"><i class="bi bi-check2"></i> Guardar</button>
      </div>
    </form>
  </div>
</div>
