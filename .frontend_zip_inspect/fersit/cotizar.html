  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg fersit-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html"><i class="bi bi-shield-shaded"></i> FERSIT <span class="text-muted fw-normal small">ALARMAS</span></a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><i class="bi bi-list fs-3"></i></button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
        <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
        <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
        <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
        <li class="nav-item ms-lg-2"><a class="btn btn-fersit-outline btn-sm active" href="cotizar.html">Cotizar</a></li>
        <li class="nav-item ms-lg-2"><a class="btn btn-fersit btn-sm" href="login.html">Ingresar</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero" style="padding:4rem 0;">
  <div class="container">
    <span class="hero-badge"><i class="bi bi-file-earmark-text-fill"></i> Sin compromiso</span>
    <h1>Solicitar Cotización</h1>
    <p class="lead mt-2">Cuéntanos qué necesitas y te enviaremos una propuesta personalizada.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="form-card">
          <form>
            <h5 class="mb-3" style="color:var(--fersit-navy);"><i class="bi bi-person-circle"></i> Datos de contacto</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6"><label class="form-label">Nombre completo *</label><input class="form-control" required></div>
              <div class="col-md-6"><label class="form-label">Teléfono *</label><input class="form-control" required></div>
              <div class="col-md-6"><label class="form-label">Correo electrónico *</label><input type="email" class="form-control" required></div>
              <div class="col-md-6"><label class="form-label">Dirección</label><input class="form-control"></div>
            </div>
            <h5 class="mb-3" style="color:var(--fersit-navy);"><i class="bi bi-gear-fill"></i> Servicio requerido</h5>
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Tipo de servicio *</label>
                <select class="form-select" required>
                  <option value="">-- Selecciona --</option>
                  <option>Alarma residencial</option><option>Alarma comercial</option>
                  <option>Cámaras CCTV</option><option>Control de accesos</option>
                  <option>Cerco eléctrico</option><option>Mantenimiento</option><option>Otro</option>
                </select>
              </div>
              <div class="col-md-6"><label class="form-label">Tipo de inmueble</label>
                <select class="form-select"><option>Vivienda</option><option>Oficina</option><option>Local comercial</option><option>Bodega</option><option>Otro</option></select>
              </div>
              <div class="col-12"><label class="form-label">Describe tu necesidad *</label><textarea class="form-control" rows="5" placeholder="Ej: Necesito 4 cámaras exteriores y alarma con sensor de movimiento para mi casa de 200m²" required></textarea></div>
              <div class="col-12 d-flex flex-wrap gap-2">
                <button class="btn btn-fersit"><i class="bi bi-send"></i> Enviar solicitud</button>
                <button type="reset" class="btn btn-fersit-outline">Limpiar</button>
                <a href="index.html" class="btn btn-link ms-auto">Cancelar</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
