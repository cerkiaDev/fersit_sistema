<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><title>Iniciar Sesión - FERSIT Alarmas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="login-wrapper">
  <div class="login-card">
    <div class="logo">
      <i class="bi bi-shield-shaded"></i>
      <h1 class="mt-2">FERSIT ALARMAS</h1>
      <p class="subtitle">Panel administrativo</p>
    </div>
    <form action="admin/dashboard.html">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-person"></i></span><input class="form-control" placeholder="admin" required></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-lock"></i></span><input type="password" class="form-control" placeholder="••••••••" required></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <label class="form-check"><input type="checkbox" class="form-check-input"> <span class="form-check-label small">Recordarme</span></label>
        <a href="#" class="small">¿Olvidaste tu contraseña?</a>
      </div>
      <button class="btn btn-fersit w-100" type="submit"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      <div class="text-center mt-3"><a href="index.html" class="small text-muted"><i class="bi bi-arrow-left"></i> Volver al sitio</a></div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
