<div class="admin-topbar">
  <div class="d-flex align-items-center gap-2">
    <button class="sidebar-toggle"><i class="bi bi-list"></i></button>
    <div>
      <h6 class="mb-0">{% block topbar_title %}Panel{% endblock %}</h6>
      <small class="text-muted">{% block topbar_subtitle %}{% endblock %}</small>
    </div>
  </div>
  <div class="user-chip">
    <div class="avatar">{{ request.user.username|first|upper|default:"A" }}</div>
    <span class="d-none d-sm-inline">{{ request.user.get_full_name|default:request.user.username|default:"Administrador" }}</span>
  </div>
</div>
